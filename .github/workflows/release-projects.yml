name: Projects Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric fork version (for example 0.1.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: projects-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'gabritorres/port-killer'
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Validate version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Test
        working-directory: platforms/macos
        run: swift test --parallel
      - name: Build universal app and archives
        working-directory: platforms/macos
        run: ./scripts/build-projects-release.sh "$VERSION"
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PortKiller-Projects-${{ inputs.version }}
          path: |
            platforms/macos/.build/projects-release/*.dmg
            platforms/macos/.build/projects-release/*.zip
            platforms/macos/.build/projects-release/SHA256SUMS.txt
      - name: Publish prerelease
        shell: bash
        run: |
          TAG="projects-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release already exists for $TAG; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "PortKiller Projects $VERSION beta" \
            --notes "Universal macOS beta. Ad-hoc signed; not Developer ID signed or Apple notarized. Read INSTALL.md and CHANGELOG.md before installing." \
            "platforms/macos/.build/projects-release/PortKiller-Projects-$VERSION-macos-universal.dmg" \
            "platforms/macos/.build/projects-release/PortKiller-Projects-$VERSION-macos-universal.zip" \
            platforms/macos/.build/projects-release/SHA256SUMS.txt
